[package]
name = "granite-embed"
version = "0.1.0"
description = "Local Granite text embeddings with ONNX Runtime"
edition = "2024"

[dependencies]
memmap2 = "0.9"
ort = "=2.0.0-rc.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = "0.23.1"
unicode-normalization = "0.1"
ureq = { version = "3.3", default-features = false, features = ["native-tls"] }

[dev-dependencies]
tempfile = "3"
