[package]
name = "archive"
version = "0.1.0"
description = "Durable local memory for coding agents, exposed over MCP"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
merman-analysis = "=0.8.0-alpha.3"
ort = "=2.0.0-rc.13"
pulldown-cmark = { version = "=0.13.4", default-features = false }
rmcp = { version = "3.1.0", features = ["transport-io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = "0.23.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
unicode-normalization = "0.1"

[dev-dependencies]
rmcp = { version = "3.1.0", features = ["client", "transport-io"] }
tempfile = "3"
